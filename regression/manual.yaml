# What only a person can check: real phones, real Home Assistant, printed paper, voice (project standard 3.1).
# Keys are stable (their IDs live in ids/manual.yaml). Record a result for the current version with:
#   python3 regression/run.py manual <key> pass|fail --note "what you saw"
- key: ha-sidebar-panel
  area: Home Assistant
  steps:
  - Open Home Inventory from the Home Assistant sidebar on a computer and in the Companion app; it loads signed in as you.
- key: phone-camera-photo
  area: phone
  steps:
  - On a phone, Quick photos takes a picture with the camera and the item appears (or is queued) without errors.
- key: phone-offline-queue
  area: phone
  steps:
  - With the phone offline, take two quick photos; they show as waiting and upload by themselves once back online.
- key: barcode-camera-scan
  area: phone
  steps:
  - Scan a real product barcode with the phone camera; it finds the item (or offers to add it).
- key: nfc-tag-write-and-tap
  area: phone
  steps:
  - Write an NFC tag to a container from the phone, then tap it; the container opens.
- key: printed-label-qr
  area: printing
  steps:
  - Print a container label, scan its QR code with a phone camera; it opens that container in Home Assistant.
- key: printed-checklist-roundtrip
  area: printing
  steps:
  - Print a container checklist, tick and cross a few rows by hand, photograph it; the read-back matches what you marked.
- key: ai-photo-identify
  area: AI
  steps:
  - With your AI provider configured, a photo of a known tool is named sensibly and filed in the right category.
- key: ai-manual-read
  area: AI
  steps:
  - Read a real equipment manual (PDF); the maintenance tasks and parts it proposes match the manual.
- key: voice-where-is
  area: voice
  steps:
  - Ask Assist (and Alexa, if set up) "where is the drill"; the answer names the right place and no customer details.
- key: push-notification
  area: Home Assistant
  steps:
  - A voice answer or "show me" request arrives as a Home Assistant push notification on the phone.
- key: hour-meter-sensor
  area: AI
  steps:
  - An equipment item linked to a real Home Assistant hours sensor shows the sensor's current reading.
- key: integration-entities
  area: Home Assistant
  steps:
  - The companion integration's sensors and to-do list show in Home Assistant and update after a change in the App.
- key: integration-local-only
  area: Home Assistant
  steps:
  - In the integration's setup, a public (internet) App URL is refused with the "must be on your local network" message.
- key: ha-backup-restore
  area: Home Assistant
  steps:
  - A Home Assistant backup includes Home Inventory; restoring it on a test system brings back items and photos.
- key: app-update-keeps-data
  area: install
  steps:
  - Updating the App from the previous version keeps all items, photos and settings.
- key: standalone-container
  area: install
  steps:
  - The standalone container (docs/install-container-core.md) starts and the integration connects to it from Home Assistant Core.
- key: dark-theme
  area: look
  steps:
  - With Home Assistant in dark mode, the App follows it and every page stays readable.
- key: phone-layout-feel
  area: phone
  steps:
  - Use the App one-handed on a phone for five minutes (find, add, move an item); nothing is hard to tap or hidden.
