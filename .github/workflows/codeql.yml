# CodeQL code scanning, weekly and on demand only (STANDARD.md 1.5): a newly introduced issue can take up to a week
# to show up in Security > Code scanning. GitHub's CodeQL "default setup" must be switched off
# (Settings > Code security > Code scanning) so the two don't both run.
name: CodeQL
on:
  schedule:
    - cron: "17 4 * * 0"        # Sunday 04:17 UTC: two hours after this project's weekly CI slot
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: Legal-Copy7045/project-standards/.github/workflows/codeql.yml@1f5964bc45844dc0cefda0374af8f8128daa1b40 # v1.1.0
    with:
      languages: '["actions", "python", "javascript-typescript"]'
