# Releases are published automatically: when a merge to main changes the
# App's version (home_inventory/config.yaml), this creates the GitHub release
# (tag = the version, e.g. 0.10.3; notes from docs/release-notes/v<version>.md)
# and builds the prebuilt App images, so Home Assistant downloads an image
# instead of building it on the device, and HACS sees the new version.
# Publishing a release by hand, or running this workflow manually, also
# builds the images. See docs/publishing.md.
#
# Images: ghcr.io/legal-copy7045/{aarch64,amd64}-home-inventory:<version>
# Home Assistant uses them once home_inventory/config.yaml contains
#   image: "ghcr.io/legal-copy7045/{arch}-home-inventory"
name: Release

on:
  push:
    branches: [main]
    paths: [home_inventory/config.yaml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check versions agree with each other and the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "version=$(python3 .github/scripts/check_versions.py "$TAG")" >> "$GITHUB_OUTPUT"

  publish:
    # Only for merges; a release that already exists is left alone.
    if: github.event_name == 'push'
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Create the GitHub release for this version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to publish."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes="docs/release-notes/v$VERSION.md"
          test -f "$notes" || { echo "::error::$notes is missing"; exit 1; }
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$notes"
          echo "created=true" >> "$GITHUB_OUTPUT"

  images:
    # Releases created by the publish job don't trigger other workflows,
    # so the images are built here for those too.
    needs: [version, publish]
    if: >-
      always() && needs.version.result == 'success' &&
      (github.event_name != 'push' || needs.publish.outputs.created == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Base image for this architecture
        id: base
        run: echo "from=$(grep '^  ${{ matrix.arch }}:' home_inventory/build.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: home_inventory
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.from }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ needs.version.outputs.version }}
          labels: |
            io.hass.name=Home Inventory
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.title=Home Assistant App: Home Inventory
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          tags: |
            ghcr.io/legal-copy7045/${{ matrix.arch }}-home-inventory:${{ needs.version.outputs.version }}
            ghcr.io/legal-copy7045/${{ matrix.arch }}-home-inventory:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke-test the published image
        if: matrix.arch == 'amd64'
        run: |
          docker run -d --name hinv -p 8099:8099 ghcr.io/legal-copy7045/amd64-home-inventory:${{ needs.version.outputs.version }}
          for i in $(seq 1 30); do curl -sf localhost:8099/api/health && break; sleep 1; done
          curl -sf localhost:8099/api/health
          docker stop hinv
