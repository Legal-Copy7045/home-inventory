name: CI

# GitHub Actions minutes are limited (see docs/development.md, "CI and its cost"):
# - pull requests only, never drafts: open a PR as a draft and mark it ready once
#   local checks pass, so CI runs once; no second run when it merges to main;
# - main gets one full run a week, and any time on demand;
# - the slow jobs (Home Assistant tests with the browser smoke test, the two image
#   builds) and the App's unit tests run only when the PR touches what they test.
# Job names are unchanged: skipped jobs count as passed for required checks.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "37 5 * * 1"  # Mondays 05:37 UTC, everything
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # What the pull request touches, so slow jobs run only when they test it.
  changes:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.diff.outputs.server }}
      app: ${{ steps.diff.outputs.app }}
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files="$(git diff --name-only "$BASE"...HEAD)"
          echo "$files"
          has() { if grep -qE "$1" <<<"$files"; then echo true; else echo false; fi; }
          ci='^\.github/workflows/ci\.yaml$'
          echo "server=$(has "^home_inventory/server/|^regression/|$ci")" >> "$GITHUB_OUTPUT"
          echo "app=$(has "^home_inventory/(server|frontend)/|^custom_components/|^tests/|^deploy/|^pytest\.ini$|$ci")" >> "$GITHUB_OUTPUT"
          echo "image=$(has "^home_inventory/(Dockerfile|build\.yaml|config\.yaml|server/|frontend/)|^deploy/standalone/|$ci")" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    # Weekly and on demand: always. On a PR: when it touches what this tests.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.server == 'true')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: home_inventory/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[test]'
      - run: ruff check home_inventory_server tests
      - run: pytest -q

  frontend:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: home_inventory/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: home_inventory/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  integration:
    needs: changes
    # Weekly and on demand: always. On a PR: when it touches what this tests.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.app == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      - name: Build UI (served by the App under test)
        run: cd home_inventory/frontend && npm ci && npm run build
      - name: Install Home Assistant test harness and the App backend
        run: |
          pip install pytest-homeassistant-custom-component
          pip install "$(grep -o 'home-assistant-frontend==[0-9.]*' $(python -c 'import homeassistant,os;print(os.path.dirname(homeassistant.__file__))')/components/frontend/manifest.json)"
          pip install -e home_inventory/server
          # Assist's sentence matcher, at the version Home Assistant uses (checks deploy/assist sentences).
          pip install "$(python -c 'import homeassistant,os,json;print(next(r for r in json.load(open(os.path.dirname(homeassistant.__file__)+"/components/conversation/manifest.json"))["requirements"] if r.startswith("hassil")))')"
      - run: pytest -q -p no:logging
      - name: Browser end-to-end smoke test
        run: |
          npx --yes playwright@1 install --with-deps chromium
          npm init -y >/dev/null && npm install playwright@1 >/dev/null
          mkdir -p /tmp/e2e
          (cd home_inventory/server && HINV_DATA_DIR=/tmp/e2e HINV_TRUSTED_PROXIES=127.0.0.1 HINV_AI_PROVIDER=none HINV_ADMIN_USERS=e2e-user \
             HINV_INGRESS_PORT=18099 HINV_API_PORT=18100 HINV_BARCODE_OPEN_FACTS=false HINV_BARCODE_UPCITEMDB=false \
             python -m home_inventory_server &)
          sleep 5
          node tests/e2e/smoke.mjs

  # Security checks.  Thresholds are chosen to fail on actionable problems
  # only; see docs/security.md ("Automated checks") for the reasoning.
  security:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # full history for the secret scan
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Python dependencies (pip-audit, known vulnerabilities)
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install -q pip-audit ./home_inventory/server
          /tmp/audit/bin/pip-audit --skip-editable --progress-spinner off
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      - name: JavaScript dependencies (npm audit, shipped code, high and critical)
        working-directory: home_inventory/frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan (gitleaks, whole history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --no-banner -c /repo/.gitleaks.toml

  hassfest:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235  # master

  hacs:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main
        with:
          category: integration
          # Remove once the repository topics are set and the brands PR is
          # merged (needed for the default HACS store, see docs/publishing.md).
          ignore: brands topics

  app-lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: frenck/action-addon-linter@479f4f053b96ed00a83ce2c7d8f858e22475aa98  # v2
        with:
          path: ./home_inventory
      - name: Versions agree everywhere and have a changelog entry
        run: python3 .github/scripts/check_versions.py

  standalone-build:
    needs: changes
    # Weekly and on demand: always. On a PR: when it touches what this tests.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.image == 'true')) }}
    # Home Assistant Container/Core installs: the companion container is built
    # from deploy/standalone/docker-compose.yaml on plain python:alpine, with
    # no Supervisor. Build it exactly as the install guide says and check the
    # API answers on 8100 and the integration token is written.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build and start the companion container
        working-directory: deploy/standalone
        run: docker compose up -d --build
      - name: Health and integration token
        working-directory: deploy/standalone
        run: |
          for i in $(seq 1 60); do
            if curl -sf localhost:8100/api/health; then ok=1; break; fi
            sleep 1
          done
          docker compose logs --tail 20
          test "${ok:-}" = 1
          docker compose exec -T home-inventory test -s /data/integration_token
      - name: Stop
        if: always()
        working-directory: deploy/standalone
        run: docker compose down

  app-build:
    needs: changes
    # Weekly and on demand: always. On a PR: when it touches what this tests.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.image == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build the App image (amd64)
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.13-alpine3.22 -t home-inventory:ci home_inventory
      - name: Start, check health, stop
        run: |
          docker run -d --name hinv -p 8099:8099 home-inventory:ci
          for i in $(seq 1 30); do curl -sf localhost:8099/api/health && break; sleep 1; done
          docker stop hinv
          docker logs hinv | tail -5
      # Trivy runs from its pinned container image (no third-party action,
      # no secrets; the job token is read-only).
      - name: Image vulnerability scan (Trivy; fixable CRITICAL fails, HIGH is reported)
        run: |
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.62.1 "$@"; }
          trivy image --quiet --ignore-unfixed --severity HIGH --exit-code 0 home-inventory:ci
          trivy image --quiet --ignore-unfixed --severity CRITICAL --exit-code 1 home-inventory:ci
