# Home Inventory companion container for Home Assistant *Container* or *Core*
# installations (no Supervisor).  Home Assistant OS / Supervised users should
# install the App from the Apps store instead.
#
#   docker compose up -d --build
#   docker compose exec home-inventory cat /data/integration_token
#
# Then in Home Assistant: Settings → Devices & services → Add integration →
# "Home Inventory", URL http://<this host>:8100, paste the token, and keep
# "Add Inventory to the sidebar" ticked.
services:
  home-inventory:
    build:
      context: ../../home_inventory
      args:
        BUILD_FROM: python:3.13-alpine
    container_name: home-inventory
    restart: unless-stopped
    environment:
      HINV_MODE: standalone
      # Recommended: Home Assistant access (an administrator's long-lived
      # token, kept in .env, never in Git). Lets the App look up who is asking
      # (names and administrators for voice and automations), link Home
      # Assistant entities to equipment, and use AI Task.
      # HINV_HA_URL: http://homeassistant.local:8123
      # HINV_HA_TOKEN: ${HA_LONG_LIVED_TOKEN}
      # Optional AI via Home Assistant's AI Task (e.g. Google Gemini), with the above:
      # HINV_AI_PROVIDER: home_assistant
      # Or call a provider directly:
      # HINV_AI_PROVIDER: gemini
      # HINV_AI_API_KEY: ${GEMINI_API_KEY}
      HINV_AI_PROVIDER: none
    volumes:
      - ./data:/data
      # For AI Task image hand-off, share Home Assistant's media folder:
      # - /path/to/homeassistant/media:/media
    # No extra privileges inside the container.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      # Only the token-protected API port is published, and only on one
      # address.  The default, 127.0.0.1, suits Home Assistant on this same
      # host (with host networking).  If Home Assistant runs on another
      # machine, set HINV_BIND_IP in .env to this host's LAN address, e.g.
      # HINV_BIND_IP=192.168.1.20.  Never 0.0.0.0, and never forward it from
      # your router: the token is sent unencrypted and gives full access.
      - "${HINV_BIND_IP:-127.0.0.1}:8100:8100"
