# Home Inventory voice questions for Home Assistant Assist (English).
#
# Copy this file to <config>/custom_sentences/en/home_inventory.yaml (the
# folder next to configuration.yaml), then restart Home Assistant or run the
# "Conversation: Reload" action. Needs the Home Inventory integration 0.16.0+
# ("where does … go" needs 0.22.0+, "I've moved … to …" 0.23.0+, "what's in …" 0.26.0+,
# the maintenance questions with equipment, ranges, parts and history 0.33.0+).
# Siri uses these too when your Shortcut passes your words to Assist.
language: "en"
intents:
  # "Where is the hedge trimmer?"
  HomeInventoryWhereIs:
    data:
      - sentences:
          - "where is [the|my] {item}"
          - "where are [the|my] {item}"
          - "where's [the|my] {item}"
          - "where did I (put|leave) [the|my] {item}"
          - "where (do|did) (I|we) keep [the|my] {item}"
          - "find [the|my] {item}"
          - "have I got [a|any] {item}"
          - "do I have [a|any] {item}"

  # "Where does the hammer go?" - where it belongs, for putting it back.
  HomeInventoryWhereDoesItGo:
    data:
      - sentences:
          - "where (does|do) [the|my] {item} go [back]"
          - "where (does|do) [the|my] {item} (live|belong)"
          - "where should [the|my] {item} go"
          - "where (do|should) I put away [the|my] {item}"
          - "where (do|should) I (put|store) [the|my] {item} [back|away]"
          - "where should I keep [the|my] {item}"
          - "where (do|should) I put [the|my] {item} (back|away)"
          - "tell me where to (put|keep|store) [the|my] {item} [back|away]"
          - "where (does|do) [the|my] {item} get put away"

  # "What's in box 5?" / "What's on the top shelf?"
  HomeInventoryWhatsIn:
    data:
      - sentences:
          - "what('s| is) (in|inside|on) [the|my] {place}"
          - "what do I (have|keep) (in|on) [the|my] {place}"
          - "list (what's|what is) (in|on) [the|my] {place}"

  # "I've moved the engine oil to small engine repair" / "...to container number 5".
  # Asks which one when unclear ("Did you mean...?" takes yes or no).
  HomeInventoryMove:
    data:
      - sentences:
          - "[that] I('ve| have) moved [the|my] {item} to [the] {place}"
          - "[that] I moved [the|my] {item} to [the] {place}"
          - "[that] I('ve| have) put [the|my] {item} (in|into|on) [the] {place}"
          - "[that] I put [the|my] {item} (in|into|on) [the] {place}"
          - "move [the|my] {item} to [the] {place}"
          - "[the|my] {item} (is|are) now (in|on) [the] {place}"

  # The answer to "Which one did you mean?" / "Did you mean...?" (within two minutes).
  HomeInventoryChoose:
    data:
      - sentences:
          - "the {choice} [one]"
          - "I meant [the] {choice}"
          - "I mean [the] {choice}"
      - sentences:
          - "(yes|yeah|yep|correct|that's right) [please]"
        slots:
          choice: "yes"
      - sentences:
          - "(no|nope|neither) [thanks]"
          - "none of them"
        slots:
          choice: "no"

  # "Tell me what upcoming maintenance I need to perform [on the Toro lawn mower]."
  # "What maintenance is overdue?" / "What maintenance do I need to do this week?"
  # Answered from the real schedules, most urgent first; asks which machine
  # when the name could mean more than one.
  HomeInventoryMaintenanceDue:
    data:
      - sentences:
          - "[tell me] what [upcoming] maintenance (do I need|I need|have I got) to (do|perform)"
          - "what maintenance is (due|coming up)"
          - "what (needs|is due for) servicing"
          - "is anything due for (maintenance|servicing|a service)"
          - "what('s| is) the upcoming maintenance"
        slots:
          range: "upcoming"
      - sentences:
          - "[tell me] what [upcoming] maintenance (do I need|I need|have I got) to (do|perform) on [the|my] {equipment}"
          - "what maintenance is (due|needed|coming up) (on|for) [the|my] {equipment}"
          - "what does [the|my] {equipment} need"
          - "is [the|my] {equipment} due for (maintenance|a service)"
        slots:
          range: "upcoming"
      - sentences:
          - "what maintenance is overdue"
          - "is any maintenance overdue"
          - "what('s| is) overdue for (maintenance|servicing)"
        slots:
          range: "overdue"
      - sentences:
          - "what maintenance is overdue (on|for) [the|my] {equipment}"
        slots:
          range: "overdue"
      - sentences:
          - "what maintenance (do I need to do|is due) {range}"
          - "what maintenance (do I need to do|is due) {range} (on|for) [the|my] {equipment}"

  # "What parts do I need for the next mower service?"
  HomeInventoryMaintenanceParts:
    data:
      - sentences:
          - "what parts do I need for the next [service (on|of|for)] [the|my] {equipment} [service]"
          - "what (parts|do I need) (to service|for servicing) [the|my] {equipment}"

  # "Do I have the parts I need to service the snowblower?"
  HomeInventoryHaveParts:
    data:
      - sentences:
          - "do I have [the|all the|everything] [parts] I need to service [the|my] {equipment}"
          - "have I got [the|everything] [parts] (to service|for) [the|my] {equipment}"
          - "do I have the parts for [the|my] {equipment} [service]"

  # "When did I last change the oil in the mower?"
  HomeInventoryLastService:
    data:
      - sentences:
          - "when did (I|we) last {task} (in|on|of|for) [the|my] {equipment}"
          - "when (was|were) [the|my] {equipment} {task} last"
          - "when did (I|we) last {task}"

  # "What equipment needs attention?"
  HomeInventoryNeedsAttention:
    data:
      - sentences:
          - "what equipment needs (attention|servicing|maintenance)"
          - "does any(thing| equipment) need attention"
          - "which (machines|equipment) need (attention|servicing)"

  # "What maintenance have I completed recently?"
  HomeInventoryRecentMaintenance:
    data:
      - sentences:
          - "what maintenance have (I|we) (completed|done) [recently|lately]"
          - "what (servicing|maintenance) (was|has been) done recently"

  # "What's running low?" - supplies below their minimum.
  HomeInventoryRunningLow:
    data:
      - sentences:
          - "what('s| is) running low"
          - "what am I running low on"
          - "what do I need to (buy|restock)"
          - "what('s| is) low on stock"

  # "What's lent out?" - what's on loan, and to whom.
  HomeInventoryOnLoan:
    data:
      - sentences:
          - "what('s| is| have I) lent out"
          - "what have I lent [out]"
          - "what('s| is) on loan"
          - "who has my stuff"
          - "who('s| has) borrowed [my] (stuff|things)"

lists:
  equipment:
    wildcard: true
  task:
    wildcard: true
  range:
    values:
      - in: "today"
        out: "today"
      - in: "this week"
        out: "week"
      - in: "this month"
        out: "month"
  item:
    wildcard: true
  choice:
    wildcard: true
  place:
    wildcard: true
