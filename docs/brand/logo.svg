<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
  <svg x="0" y="0" width="400" height="400" viewBox="0 0 512 512">  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#0277BD"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCA28"/>
      <stop offset="1" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#01325a" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>
  <!-- box -->
  <g filter="url(#soft)" transform="translate(-22 10)">
    <path d="M256 168 L380 225 L256 282 L132 225 Z" fill="#FFFFFF"/>
    <path d="M132 225 L256 282 L256 414 L132 357 Z" fill="#E1F1FC"/>
    <path d="M256 282 L380 225 L380 357 L256 414 Z" fill="#B6DCF6"/>
    <!-- tape -->
    <path d="M178 189.5 L210 175 L334 232 L302 246.5 Z" fill="#CFE8FA"/>
    <path d="M302 246.5 L334 232 L334 364 L302 378.5 Z" fill="#94C9EE"/>
    <!-- label on front-left face -->
    <path d="M160 288 L218 314.5 L218 352 L160 325.5 Z" fill="#FFFFFF" opacity=".95"/>
    <path d="M170 302 L208 319.5 M170 314 L196 326" stroke="#7FB8E3" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- location pin -->
  <g filter="url(#soft)" transform="translate(-12 0)">
    <path d="M372 76 c-42 0 -76 33 -76 75 c0 54 76 124 76 124 s76 -70 76 -124 c0 -42 -34 -75 -76 -75 z"
          fill="url(#pin)" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
    <circle cx="372" cy="150" r="26" fill="#FFFFFF"/>
  </g>
</svg>
  <text x="440" y="185" font-family="Inter Display, Inter, sans-serif" font-weight="800" font-size="118" letter-spacing="-2" fill="#0B3B5E">Home</text>
  <text x="440" y="310" font-family="Inter Display, Inter, sans-serif" font-weight="800" font-size="118" letter-spacing="-2" fill="#0288D1">Inventory</text>
</svg>